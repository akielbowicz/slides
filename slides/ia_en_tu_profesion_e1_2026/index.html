<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>E1 — Fundamentos · IA en tu profesión</title>
  <link rel="stylesheet" href="vendor/reveal/reset.css">
  <link rel="stylesheet" href="vendor/reveal/reveal.css">
  <link rel="stylesheet" href="vendor/reveal/theme.css">
</head>
<body>
  <div class="reveal">
    <div class="slides">
      <!-- El contenido vive en slides.md. Separadores: --- horizontal, -- vertical,
       NOTES: notas; data-fragment para aparecer de a uno los elementos sueltos -->
      <section data-markdown="slides.md"
               data-separator="^\r?\n---\r?\n$"
               data-separator-vertical="^\r?\n--\r?\n$"
               data-separator-notes="^NOTES:"
               data-charset="utf-8"></section>
    </div>
  </div>
  <script src="vendor/reveal/reveal.js"></script>
  <script src="vendor/reveal/plugin/markdown/markdown.js"></script>
  <script src="vendor/reveal/plugin/notes/notes.js"></script>
  <script src="vendor/reveal/plugin/search/search.js"></script>
  <script>
    Reveal.initialize({
      // 16:9 de diseño; reveal magnifica con transform hasta llenar pantalla
      markdown: { animateLists: true },  // los ítems de lista aparecen de a uno
      width: 960,
      height: 540,
      margin: 0.06,
      hash: true,
      history: true,
      slideNumber: 'c/t',
      progress: true,
      transition: 'fade',
      plugins: [RevealMarkdown, RevealNotes, RevealSearch]
    });
  </script>
</body>
</html>
